<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QPinoy — Offline</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Manrope:wght@400;600;700&display=swap');

  :root {
    --ink: #12141c;
    --ink2: #1b1e29;
    --ink-border: rgba(237, 232, 221, 0.09);
    --text: #ede8dd;
    --text-dim: #9297a6;
    --brass: #c98a3e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ink);
    font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
    color: var(--text);
    padding: 24px;
  }

  .card {
    max-width: 420px;
    width: 100%;
    background: var(--ink2);
    border: 1px solid var(--ink-border);
    border-radius: 20px;
    padding: 28px;
    text-align: center;
  }

  .ticket {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 12px;
  }

  h1 {
    font-size: 20px;
    margin: 0 0 10px;
  }

  p {
    color: var(--text-dim);
    line-height: 1.6;
    font-size: 14px;
    margin: 0 0 20px;
  }

  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    background: var(--brass);
    color: var(--ink);
    border: none;
    border-radius: 12px;
    padding: 12px 20px;
    cursor: pointer;
  }

  button:active { transform: scale(0.98); }
</style>
</head>
<body>
  <div class="card">
    <div class="ticket">— No. offline —</div>
    <h1>Can't reach the line right now</h1>
    <p>
      QPinoy needs a connection to pull live queue updates. Whatever was
      loaded last is still cached — reconnect and refresh to pick up where
      the line actually stands.
    </p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
